name: Build Android release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and upload to (for example android-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Add Android 37 compatibility alias
        run: |
          set -euo pipefail
          platform_dir="$ANDROID_HOME/platforms/android-37.0"
          test -d "$platform_dir"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Decode signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aninews-release.jks
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret ANDROID_SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aninews-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.release_tag }}"
            version="${version#android-v}"
          fi
          bash ./android/gradlew --no-daemon -p android :app:assembleRelease \
            -PandroidVersionCode="$GITHUB_RUN_NUMBER" \
            -PandroidVersionName="$version"

      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
          fi
          version="${tag#android-v}"
          apk="AniNewsHub-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          gh release upload "$tag" "$apk" --clobber
